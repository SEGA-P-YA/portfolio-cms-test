media:
  - name: images
    label: 画像
    input: images
    output: /images
    extensions: [jpg, jpeg, png, webp, gif, svg]
    categories: [image]

content:
  - name: works
    label: 作品
    type: collection
    path: works
    format: yaml-frontmatter
    extension: md
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: image
        label: 作品画像
        type: image
        options:
          media: images
      - name: thumbnail
        label: サムネイル画像（必要な場合のみ）
        type: image
        options:
          media: images
      - name: category
        label: カテゴリー
        type: select
        options:
          values: [FAN ART, COMMISSION, WORKS, ORIGINAL]
      - name: year
        label: 制作年
        type: number
      - name: description
        label: 説明
        type: text
      - name: order
        label: 表示順（小さい順に並びます）
        type: number
      - name: published
        label: 公開する
        type: boolean
        default: true
      - name: featured
        label: メインビジュアルに設定する
        type: boolean
        default: false
      - name: hasDetail
        label: 詳細ページを作る
        type: boolean
        default: false
      - name: detailDescription
        label: 詳細ページ用の説明（詳細ページを作る場合のみ）
        type: text
      - name: role
        label: 制作担当範囲（詳細ページ用）
        type: string
      - name: medium
        label: 使用媒体・掲載先（詳細ページ用）
        type: string
      - name: client
        label: クライアント情報（公開許可がある場合のみ・詳細ページ用）
        type: string
      - name: relatedLink
        label: 関連リンク（詳細ページ用）
        type: string
